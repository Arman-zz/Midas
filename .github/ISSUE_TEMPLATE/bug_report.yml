name: Bug report
description: Report a reproducible problem in MIDAS
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve MIDAS. Do not include credentials, NID values, or private customer data.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as...
        2. Open...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Affected role
      options:
        - Public visitor
        - Customer
        - Shop
        - Administrator
        - Multiple roles
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or console output if useful.
